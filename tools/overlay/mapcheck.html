<script>
// ---------- "Map not loading?" check, in the map type sheet ----------
// Shows what the base map is doing on this phone (version, signal, tiles loaded / failed and why) and can test one tile of each
// map live. "Reset map storage" empties only the saved map tiles and fetches the newest app; finds, tracks and settings stay.
(()=>{ const MC={ok:{},err:{},last:{}};
  tileRoot.addEventListener('load',e=>{ const t=e.target; if(t.tagName!=='IMG') return; const k=(t.parentNode&&t.parentNode.parentNode&&t.parentNode.parentNode.className||'').replace('ogtl ogtl-',''); MC.ok[k]=(MC.ok[k]||0)+1; },true);
  tileRoot.addEventListener('error',e=>{ const t=e.target; if(t.tagName!=='IMG') return; const k=(t.parentNode&&t.parentNode.parentNode&&t.parentNode.parentNode.className||'').replace('ogtl ogtl-',''); MC.err[k]=(MC.err[k]||0)+1; MC.last[k]=t.src; },true);
  const nm={b:'Street',h:'Relief',s:'Satellite'};
  const sh=document.getElementById('gmSheet'); if(!sh) return;
  sh.insertAdjacentHTML('beforeend',`<details class="mchk" id="mChk"><summary>Map not loading? Check it</summary>
    <pre id="mChkOut" style="white-space:pre-wrap;font-size:12px;line-height:1.35;margin:6px 0;user-select:text;-webkit-user-select:text"></pre>
    <div class="row" style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn" id="mChkTest">Test the maps now</button><button class="btn" id="mChkCopy">Copy report</button><button class="btn" id="mChkReset">Reset map storage</button></div>
    <p class="hint">Reset clears only saved map pictures and loads the newest app. Your finds, tracks and settings stay.</p></details>`);
  const out=document.getElementById('mChkOut'); let extra='';
  async function report(){ const L=[], reg=navigator.serviceWorker?await navigator.serviceWorker.getRegistration().catch(()=>null):null;
    let run='-'; try{ const c=(await caches.keys()).find(k=>k.startsWith('atlas-v')); run=c?c.slice(7):'-'; }catch(_){}
    L.push(`App ${run} · page ${document.documentElement.dataset.og||OGE.ver}${reg?(reg.waiting||reg.installing?' · update waiting':''):' · no offline worker'}`);
    L.push(`Signal ${navigator.onLine?'yes':'no'} · map live ${OG.live?'yes':'no'} · type ${GM.type} · zoom ${ogZ()} · dark ${ogDark()?'yes':'no'}`);
    for(const [id,Ly] of Object.entries(TILES.L)){ const on=Ly.div.style.display!=='none', ok=[...Ly.tiles.values()].filter(i=>i.dataset.ok).length;
      L.push(`${nm[id]||id}: ${on?'on':'off'} · showing ${ok}/${Ly.tiles.size} · loaded ${MC.ok[id]||0} · failed ${MC.err[id]||0}`);
      if(MC.last[id]) L.push('  last fail: '+MC.last[id].replace(/^https:\/\//,'').slice(0,110)); }
    try{ const c=await caches.open('atlas-sat'); L.push(`Saved map pictures: ${(await c.keys()).length}`); }catch(e){ L.push('Saved map pictures: cache error '+(e&&e.name||e)); }
    try{ const e=await navigator.storage.estimate(); L.push(`Storage used ${Math.round(e.usage/1048576)} MB of ${Math.round(e.quota/1048576)} MB`); }catch(_){}
    if(OGE.log.length) L.push('Errors: '+OGE.log.slice(-4).join(' | '));
    out.textContent=L.join('\n')+(extra?'\n'+extra:''); }
  // one tile of each map, at the middle of the screen, fetched fresh
  function probe(name,url){ return new Promise(res=>{ const t0=performance.now(), im=new Image(); let done=false;
    const fin=s=>{ if(done) return; done=true; res(`${name}: ${s} (${Math.round(performance.now()-t0)} ms)`); };
    im.onload=()=>fin('OK'); im.onerror=()=>fin('FAILED'); setTimeout(()=>fin('no answer in 15 s'),15000); im.src=url+(url.includes('?')?'&':'?')+'chk='+Date.now(); }); }
  async function corsProbe(url){ try{ const r=await fetch(url+'?cors='+Date.now(),{mode:'cors',credentials:'omit',cache:'no-store'}); return `  direct: HTTP ${r.status} ${r.headers.get('content-type')||''}`; }catch(e){ return '  direct: '+(e&&e.message||e); } }
  document.getElementById('mChkTest').onclick=async()=>{ extra='Testing…'; await report();
    const z=Math.min(15,ogZ()||10), N=2**z, cx=(vb.x+vb.w/2)/K, cy=-(vb.y+vb.h/2), x=ogMerc.tx(cx,N), y=ogMerc.ty(cy,N), r=[];
    for(const [n,f] of [['Street',ogURL.b],['Relief',ogURL.h],['Satellite',ogURL.s]]){ const u=f(z,x,y); r.push(await probe(n,u)); r.push(await corsProbe(u)); }
    extra=r.join('\n'); report(); };
  document.getElementById('mChkCopy').onclick=()=>{ try{ navigator.clipboard.writeText(out.textContent); document.getElementById('mChkCopy').textContent='Copied'; }catch(_){} };
  document.getElementById('mChkReset').onclick=async()=>{ const b=document.getElementById('mChkReset'); b.disabled=true; b.textContent='Resetting…';
    try{ await caches.delete('atlas-sat'); }catch(_){}
    try{ const reg=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration(); if(reg){ await reg.update().catch(()=>{}); if(reg.waiting) reg.waiting.postMessage('skip'); } }catch(_){}
    OG.live=true; OG.err=0; GM.live=true; TILES.tries.clear(); setTimeout(()=>location.reload(),1200); };
  document.getElementById('mChk').addEventListener('toggle',e=>{ if(e.target.open) report(); });
})();
</script>
