<style id="OGLIDTOP">
.gmtypes button[data-lid] .mt-lid{position:relative;background:radial-gradient(circle at 28% 30%,#fbfbf9 0 9%,transparent 32%),radial-gradient(circle at 72% 70%,#5d5d59 0 10%,transparent 34%),repeating-linear-gradient(128deg,#8f8f8b 0 3px,#d2d2ce 3px 7px,#6c6c68 7px 9px),#a7a7a3}
.gmtypes .mt-lid em{position:absolute;right:4px;bottom:4px;font:700 9px/1.3 var(--f-body);font-style:normal;letter-spacing:.04em;background:rgba(0,0,0,.62);color:#fff;border-radius:6px;padding:1px 5px}
.gmtypes .mt-lid em::after{content:'OFF'}
.gmtypes button[data-lid][aria-pressed="true"] .mt-lid em{background:var(--accent)}
.gmtypes button[data-lid][aria-pressed="true"] .mt-lid em::after{content:'ON'}
#gmSheet #lidOpt2{margin:10px 0 2px}
</style>
<script>
/* OGLIDTOP (Nov 2026): the LiDAR view switch sits with the map types at the top of the map-type sheet, so it is easy to find.
   It lays over whichever map type is showing (tap again to turn it off), its see-through slider sits right under the map types,
   and it stays on across map modes and reloads until turned off. The LiDAR row in the Layers lists still works too.
   Source: tools/lidar/top.html, applied by tools/lidar/patch_top.py (idempotent). Needs OGLIDAR first. */
(()=>{ if(!window.OGLID||window.OGLIDT) return; const gt=document.getElementById('gmTypes'); if(!gt) return; window.OGLIDT=1;
  const KEY='og-lid-on', save=v=>{ try{ localStorage.setItem(KEY,v?'1':'0'); }catch(_){} };
  const b=document.createElement('button'); b.type='button'; b.dataset.lid='1'; b.setAttribute('aria-pressed','false');
  b.title='LiDAR view (bare ground): laid over any map type. Tap again to turn it off.'; b.setAttribute('aria-label','LiDAR view, laid over the map');
  b.innerHTML='<i class="mt-lid"><em></em></i><span>LiDAR</span>';
  const old=gt.querySelector('button[data-mt="old"]'); if(old) old.after(b); else gt.prepend(b);
  const place=()=>{ const o=document.getElementById('lidOpt2'); if(o&&o.previousElementSibling!==gt) gt.after(o); };
  const mark=()=>{ b.setAttribute('aria-pressed',on.has('_lidar')); place(); };
  b.addEventListener('click',e=>{ e.stopPropagation(); const v=!on.has('_lidar'); v?on.add('_lidar'):on.delete('_lidar'); save(v);
    renderLayers(); drawMarkers(); gmSheetSync(); });
  // keep it on through a change of map mode (Detecting, Minerals, History...), which otherwise resets every layer
  const sm=shSetMode; shSetMode=function(){ const had=on.has('_lidar'); const r=sm.apply(this,arguments); if(had&&!on.has('_lidar')){ on.add('_lidar'); try{ renderLayers(); }catch(_){} } mark(); return r; };
  // remember on/off however it was switched (this tile, the Layers grid or the Layers tab)
  let last=null; const rl=renderLayers; renderLayers=function(){ const r=rl.apply(this,arguments); const v=on.has('_lidar'); if(v!==last){ last=v; save(v); } try{ mark(); }catch(_){} return r; };
  const gs=gmSheetSync; gmSheetSync=function(){ const r=gs.apply(this,arguments); mark(); return r; };
  let was=false; try{ was=localStorage.getItem(KEY)==='1'; }catch(_){} last=was; if(was) on.add('_lidar');
  try{ renderLayers(); }catch(_){} try{ gmSheetSync(); }catch(_){} mark(); })();
</script>
