<script>
// ---------- old maps as tiles (v137): the old topos, the 1800s sheets and the slider maps are cut into 512 px tiles when the app is built ----------
// (tools/tiles/tiler.py). The phone then only draws the few tiles in view at a size that matches the screen, so the maps stay sharp and
// never vanish when zoomed far in (iPhone stops drawing pictures tens of thousands of pixels wide), and nothing big is decoded at once.
// The 1936 slider map is rebuilt from the full-size USGS scans, lightly sharpened so names are readable up close.
// Where the tiles aren't published (the Claude atlas page), the old whole-sheet pictures stay as they were.
var OGT={ix:null, L:{}, has(id,z,x,y){ const s=this.S[id]&&this.S[id][z]; return !!s&&s.has(x+'_'+y); }, S:{}};
fetch('ot/index.json').then(r=>r.ok?r.json():null).then(ix=>{ if(!ix||!ix.o36) return; OGT.ix=ix;
  for(const id in ix){ OGT.S[id]={}; for(const z in ix[id].t) OGT.S[id][z]=new Set(ix[id].t[z]?ix[id].t[z].split(','):[]); }
  // the slider maps cover the same box: a map hidden under a fully shown one, or faded to nothing, isn't loaded at all
  const old=()=>on.has('_oldmap'), A=()=>OGT.a||[1,0];
  const SHOW={o250:old,o15:old,ogt:()=>old()&&A()[0]<1,o72:()=>old()&&A()[0]>0&&A()[1]<1,o36:()=>old()&&A()[1]>0,o19:()=>GM.type==='1800s'};
  for(const id of ['o250','o15','o19','ogt','o72','o36']){ if(!ix[id]) continue; const M=ix[id];
    OGT.L[id]=tileLayer('t'+id,(z,x,y)=>`ot/${id}/${z}/${x}_${y}.webp`,{hd:true,minz:M.z[0],max:()=>M.z[1],has:(z,x,y)=>OGT.has(id,z,x,y),show:SHOW[id]}); }
  // the whole-sheet pictures step aside (taken out of the page, so they never download or decode)
  for(const im of document.querySelectorAll('svg image[data-f]')){ const f=im.dataset.f; if(/^(h15_|h250_|h19_)/.test(f)||['ground-today','topo-1972','topo-1936'].includes(f)){ im.setAttribute('href','data:,'); im.remove(); } }
  ogtFade(); drawMarkers(); }).catch(()=>{});
// the Today / 1972 / 1936 slider fades the tile layers the way it faded the pictures
function ogtFade(){ const r=document.getElementById('omsR'); if(!r||!OGT.ix) return; const v=+r.value, a72=Math.min(1,v/100), a36=Math.max(0,Math.min(1,(v-100)/100));
  const was=OGT.a; OGT.a=[a72,a36]; if(was&&(was[0]>=1)!==(a72>=1)||was&&(was[0]>0)!==(a72>0)||was&&(was[1]>0)!==(a36>0)||was&&(was[1]>=1)!==(a36>=1)) tilesSoon();
  const set=(id,a)=>{ const L=OGT.L[id]; if(L) L.div.style.opacity=a<1?a.toFixed(2):''; };
  set('o72',a72); set('o36',a36); set('o250',a72); set('o15',a72);
  const r19=document.getElementById('gm19r'); if(r19) set('o19',Math.min(1,+r19.value/100)); }
{ const r=document.getElementById('omsR'); if(r) r.addEventListener('input',ogtFade); const r19=document.getElementById('gm19r'); if(r19) r19.addEventListener('input',ogtFade); }
OGE.on('draw',()=>ogtFade());
</script>
